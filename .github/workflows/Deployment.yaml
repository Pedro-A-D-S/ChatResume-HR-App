name: CI & Security Guardrails

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  id-token: write

jobs:
  test-and-security:
    name: Test, SAST & Container Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-cov bandit

      - name: Code Quality & Linting (Ruff)
        run: |
          ruff check src/ tests/
          ruff format --check src/ tests/ || true

      - name: Security SAST (Bandit)
        run: |
          bandit -r src/ -ll

      - name: Unit & Integration Tests (Pytest)
        run: |
          export PYTHONPATH=src
          pytest tests/ -v --cov=src/hr_agent_platform --cov-report=term-missing
